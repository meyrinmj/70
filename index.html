<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김용인 님 고희연 초대장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF9F3;
    --peach:#F2A88F;
    --plum:#B5657A;
    --text:#4A3F3B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#F0E4DC;
    font-family:'Gowun Dodum', sans-serif;
    display:flex;
    justify-content:center;
    padding:24px 0;
  }
  .card{
    width:100%;
    max-width:400px;
    border-radius:0;
    overflow:hidden;
    box-shadow:0 20px 45px rgba(180,101,122,0.28);
    position:relative;
    color:var(--text);
    background:var(--cream);
  }
  .card-image{
    display:block;
    width:100%;
    height:auto;   /* 원본 비율 그대로, 잘리지 않음 */
  }
  .content-below{
    padding:28px 26px 30px;
    text-align:center;
  }

  .btn-row{ display:flex; justify-content:center; margin-bottom:26px; }
  .btn-solid{
    display:inline-block;
    padding:12px 30px;         /* 버튼 폭 여기서 조절 (숫자 줄이면 더 좁아져요) */
    border-radius:14px;
    font-size:13.5px;
    font-weight:600;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(135deg, var(--peach), var(--plum));
    box-shadow:0 8px 16px rgba(181,101,122,0.3);
  }

  .host{ font-size:14px; line-height:2; }
  .host .role{ display:block; font-size:12px; color:#a4948c; letter-spacing:0.15em; margin-bottom:6px; }
  .host-line{ margin-bottom:2px; }
  .tel-link{
    color:var(--plum);
    text-decoration:underline;
    text-underline-offset:3px;
    font-weight:700;
  }
  .host-note{ margin-top:10px; font-size:12.5px; color:#8a7a73; }
</style>
</head>
<body>
<div class="card">
  <img src="back.jpg" alt="고희연 초대장" class="card-image">

  <div class="content-below">
    <div class="btn-row">
      <a class="btn-solid" href="https://pcmap.place.naver.com/restaurant/12950069/home" target="_blank">📍 길찾기</a>
    </div>

    <div class="host">
      <span class="role">모시는 이</span>
      <div class="host-line"><a class="tel-link" href="tel:010-7467-1147">장녀 전미령</a> · 사위 이시용</div>
      <div class="host-line"><a class="tel-link" href="tel:010-2884-8979">차녀 전이슬</a> · 사위 공민석</div>
      <div class="host-note">자녀일동 올림</div>
    </div>
  </div>
</div>
</body>
</html>
